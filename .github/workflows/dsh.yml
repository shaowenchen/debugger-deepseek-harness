# Start a DeepSeek Harness session by hand, get a temporary link, sign in with
# a password, and start working.
#
# Trigger it from the Actions tab ("Run workflow"), or:
#   gh workflow run dsh.yml
#   gh workflow run dsh.yml -f model=some-other-model
#
# What to expect once it starts:
#   * open the run's Summary, take the link, sign in with your PASSWORD;
#   * the harness is ready to use — no setup inside it;
#   * the session ends when you Cancel workflow, or when the job times out.
#
# Nothing is persisted between sessions unless S3 inputs are configured —
# every run starts from a clean workspace.
name: DeepSeek Harness

on:
  workflow_dispatch:
    inputs:
      # The gateway address and model come from the workflow file (below), so a
      # normal run needs no typing at all. These inputs exist only to override
      # them for one run.
      #
      # Workflow inputs are plain text in the run payload — anyone who can see
      # the run can read them. That is fine for an address and a model id, and
      # it is why the API key and the password are secrets instead.
      base_url:
        description: 'Override the gateway address for this run. Empty uses the default below.'
        type: string
        default: ''
      model:
        description: 'Override the model for this run. Empty uses the default below.'
        type: string
        default: ''
      ngrok_domain:
        description: 'Reserved ngrok domain, e.g. my-dsh.ngrok.app. Empty picks a random one.'
        type: string
        default: ''
      repo:
        description: 'Name for this workspace, so parallel sessions do not share a directory.'
        type: string
        default: repo
      mount:
        description: 'Mount this repository read-only at /workspace inside the session.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Keyed by workspace name: a second run for the same workspace queues rather
  # than fighting the first over the same host ports.
  group: dsh-${{ inputs.repo }}
  cancel-in-progress: false

env:
  # ── Point these at your gateway ─────────────────────────────────────────────
  # Fill in BOTH to use a custom OpenAI-compatible gateway, for example:
  #   BASE_URL: https://gateway.example/v1
  #   MODEL: my-model-id
  #
  # Leave both empty to use the official DeepSeek endpoint, where API_KEY is
  # your DeepSeek key. Setting only one is an error the action reports before
  # it starts anything, rather than letting dsh fail later.
  BASE_URL: ''
  MODEL: ''

jobs:
  dsh:
    runs-on: ubuntu-latest
    # The session's lifetime: it ends when you cancel the run or when this fires.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          # API key and password are secrets and nothing else — never inputs,
          # which are plain text in the run payload.
          api_key: ${{ secrets.API_KEY }}
          password: ${{ secrets.PASSWORD }}
          # Address and model: the run's input wins, else the default above.
          base_url: ${{ inputs.base_url || env.BASE_URL }}
          model: ${{ inputs.model || env.MODEL }}
          ngrok_token: ${{ secrets.NGROK_TOKEN }}
          ngrok_domain: ${{ inputs.ngrok_domain }}
          workspace_dir: ${{ inputs.repo }}
          mount_repo: ${{ inputs.mount }}
