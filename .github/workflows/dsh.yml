# Start a DeepSeek Harness session by hand, get a temporary link, sign in with
# a password, and start working.
#
# Trigger it from the Actions tab ("Run workflow"), or:
#   gh workflow run dsh.yml
#   gh workflow run dsh.yml -f model=some-other-model
#
# Every secret below is a DEFAULT. Leave a field empty on the Run-workflow form
# and the secret is used; fill it in and that value wins for this one run.
#
# What to expect once it starts:
#   * open the run's Summary, take the link, sign in with your password;
#   * the harness is ready to use — no setup inside it;
#   * the session ends when you Cancel workflow, or when the job times out.
#
# Nothing is persisted between sessions unless S3 secrets are configured —
# every run starts from a clean workspace.
name: DeepSeek Harness

on:
  workflow_dispatch:
    inputs:
      # All optional. Empty means "use the secret of the same name", so a normal
      # run is just pressing the button.
      #
      # Workflow inputs are plain text in the run payload — anyone who can see
      # the run can read them. That is fine for an address, a model id, or a
      # domain name, and it is exactly why the API key and password are
      # *secrets only* and have no input here.
      base_url:
        description: 'Gateway address. Empty -> the BASE_URL secret.'
        type: string
        default: ''
      model:
        description: 'Model id, comma-separated for several. Empty -> the MODEL secret.'
        type: string
        default: ''
      ngrok_domain:
        description: 'Reserved ngrok domain. Empty -> the NGROK_DOMAIN secret, else a random one.'
        type: string
        default: ''
      repo:
        description: 'Workspace name. Empty -> "default". Also namespaces parallel sessions.'
        type: string
        default: ''
      mount:
        description: 'Mount this repository read-only at /workspace. Empty -> true.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # One source for the workspace name — this input — so the queue group and the
  # workspace directory can never disagree. `concurrency` may read only
  # github/inputs/vars (a secret here fails the workflow at parse time), and
  # this reads just the input.
  group: dsh-${{ inputs.repo || 'default' }}
  cancel-in-progress: false

jobs:
  dsh:
    runs-on: ubuntu-latest
    # The session's lifetime: it ends when you cancel the run or when this fires.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          # Credentials: secrets only, never inputs. The action fails fast if
          # the key is blank.
          api_key: ${{ secrets.API_KEY }}
          password: ${{ secrets.PASSWORD }}
          # Everything below: the run's input when filled, else the secret.
          # `repo` and `mount` are input-only — neither is a credential.
          base_url: ${{ inputs.base_url || secrets.BASE_URL }}
          model: ${{ inputs.model || secrets.MODEL }}
          ngrok_token: ${{ secrets.NGROK_TOKEN }}
          ngrok_domain: ${{ inputs.ngrok_domain || secrets.NGROK_DOMAIN }}
          workspace_dir: ${{ inputs.repo }}
          mount_repo: ${{ inputs.mount }}
