# Start a DeepSeek Harness session by hand and get a temporary link.
#   gh workflow run dsh.yml
#   gh workflow run dsh.yml -f model=some-other-model
#
# The Summary of the run carries the link; sign in with the password you set as
# the PASSWORD secret. The session ends when you cancel the run, when its
# duration runs out, or when the job times out.
name: DeepSeek Harness

on:
  workflow_dispatch:
    inputs:
      session_hours:
        description: 'Duration(hours)'
        type: choice
        # Drives both the session's own deadline and this job's timeout, so the
        # two cannot drift apart. `unlimited` is passed on as 0, which the
        # action reads as "no self-imposed limit"; the job still ends at the
        # runner's ceiling, since nothing here can outlive a GitHub-hosted job.
        #
        # Four hours by default: long enough for a working session, and it lets
        # the session stop itself and shut down cleanly rather than being killed
        # at the runner's 6-hour ceiling. Pick *unlimited* to run to that ceiling
        # instead, or 1/2 for a deliberately shorter bound.
        default: '4'
        options:
          - '1'
          - '2'
          - '4'
          - 'unlimited'
      # Every field here has a working default or falls back to a secret, so a
      # run needs none of them filled in. `password` is the one credential among
      # them: it falls back to the PASSWORD secret, and a value typed here is
      # plain text in the run — see the note on that field below.
      version:
        description: 'Version'
        type: choice
        default: '0.1.2-rc.1'
        options:
          # The dsh-web image pins this, so the session runs the same dsh.
          - '0.1.2-rc.1'
          # npm's `latest` tag, resolved at install time so it cannot go stale.
          - 'latest'
      model:
        description: 'Model'
        type: string
        # The sentinel for "no explicit choice". It is the field's default so
        # the form is never blank, and it falls through to the MODEL secret
        # below rather than overriding it.
        default: 'default'
      password:
        description: 'Password(Option)'
        type: string
        # Blank falls through to secrets.PASSWORD; if that is unset too the
        # action refuses to start rather than generating one. A value typed here
        # is plain text in the run — the action prints the password in the
        # Summary anyway, so this is not a new exposure, but the secret exists
        # for anyone who would rather it were never written down.
        default: ''
      tunnel:
        description: 'Tunnel'
        type: choice
        # Cloudflare by default: it needs no credential at all for a quick
        # tunnel, so a run works out of the box. ngrok is still offered, but
        # needs an NGROK_TOKEN to produce a link.
        default: 'cloudflare'
        options:
          # No account needed: Cloudflare mints a random trycloudflare.com
          # hostname. Set CLOUDFLARE_TOKEN to use a named tunnel instead — but
          # note a named tunnel's link cannot be discovered here (Cloudflare
          # never tells the connector its own hostname), so read it from the
          # dashboard rather than the run's Summary.
          - 'cloudflare'
          - 'ngrok'

permissions:
  contents: read

concurrency:
  # Sessions collide on the fixed gateway port, so only one runs per repository.
  group: dsh-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dsh:
    runs-on: ubuntu-latest
    # A little longer than the session itself, so the script's own deadline
    # fires first and its cleanup runs; this is the backstop, not the plan. The
    # 20-minute margin covers setup (installing dsh) plus shutdown.
    #
    # `unlimited` asks for the runner's ceiling instead: GitHub-hosted jobs are
    # capped at 6 hours (360 minutes) of execution time, so there is no headroom
    # to add the margin to.
    #
    # Written as a comparison chain rather than
    # `unlimited && 360 || fromJSON(session_hours) * 60 + 20`, which is shorter
    # and would work *if* GitHub short-circuits `&&`. `fromJSON('unlimited')` is
    # not valid JSON, so if the evaluator reaches it the whole workflow fails to
    # start — a severe outcome to bet on undocumented behaviour for. Every
    # operand here is a literal, so nothing is evaluated speculatively.
    timeout-minutes: ${{ inputs.session_hours == 'unlimited' && 360 || inputs.session_hours == '4' && 260 || inputs.session_hours == '2' && 140 || 80 }}
    steps:
      # Needed only because this workflow calls the action from the working
      # copy (`uses: ./`); the session itself uses a scratch workspace.
      - uses: actions/checkout@v4

      # Two steps, not one: `uses:` takes a literal path — expressions are not
      # allowed there — so the tunnel chosen on the form cannot select the
      # action directory. Exactly one of these runs.
      #
      # The `with:` block is repeated rather than anchored because the two
      # actions declare the same inputs and a YAML anchor here would save ten
      # lines at the cost of making the form's mapping harder to read.
      - if: inputs.tunnel == 'ngrok'
        uses: ./ngrok
        with:
          # Credentials are secrets only. base_url comes from its secret too:
          # it is set once and rarely changed, so it needs no form field.
          api_key: ${{ secrets.API_KEY }}
          # Blank on the form falls through to the PASSWORD secret, the
          # same shape `model` uses above. Both empty means the action
          # refuses to start, rather than generating a password nobody
          # chose.
          password: ${{ inputs.password != '' && inputs.password || secrets.PASSWORD }}
          version: ${{ inputs.version }}
          # `unlimited` reaches the action as 0, which it reads as
          # "no self-imposed limit".
          session_hours: ${{ inputs.session_hours == 'unlimited' && '0' || inputs.session_hours }}
          base_url: ${{ secrets.BASE_URL }}
          # 'default' — the field's own default — means "no explicit choice",
          # so it falls through to the MODEL secret. Without this the field
          # could never be blank and the secret would never be consulted. If
          # the secret is unset too the empty value reaches the action, which
          # reads it the same way and leaves dsh its own default model.
          model: ${{ inputs.model == 'default' && secrets.MODEL || inputs.model }}
          ngrok_token: ${{ secrets.NGROK_TOKEN }}
          # workspace_dir is left to the action's default — a fresh, empty
          # workspace/ directory, which is also where dsh itself runs from — so
          # it needs no form field.

      - if: inputs.tunnel == 'cloudflare'
        uses: ./cloudflare
        with:
          api_key: ${{ secrets.API_KEY }}
          # Blank on the form falls through to the PASSWORD secret, the
          # same shape `model` uses above. Both empty means the action
          # refuses to start, rather than generating a password nobody
          # chose.
          password: ${{ inputs.password != '' && inputs.password || secrets.PASSWORD }}
          version: ${{ inputs.version }}
          # `unlimited` reaches the action as 0, which it reads as
          # "no self-imposed limit".
          session_hours: ${{ inputs.session_hours == 'unlimited' && '0' || inputs.session_hours }}
          base_url: ${{ secrets.BASE_URL }}
          model: ${{ inputs.model == 'default' && secrets.MODEL || inputs.model }}
          # Blank means a quick tunnel: a random trycloudflare.com hostname with
          # no account behind it. Set the secret to use a named tunnel.
          cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
