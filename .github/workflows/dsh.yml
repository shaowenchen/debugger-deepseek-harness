# Start a DeepSeek Harness session by hand and get a temporary link.
#   gh workflow run dsh.yml
#   gh workflow run dsh.yml -f model=some-other-model
#
# The Summary of the run carries the link; sign in with your PASSWORD secret.
# The session ends when you cancel the run or the job times out.
name: DeepSeek Harness

on:
  workflow_dispatch:
    inputs:
      # All optional: empty means "use the secret of the same name", so a normal
      # run is just pressing the button. None of these is a credential — the API
      # key and password are secrets only, because a workflow input is plain
      # text any reader of the run can see.
      version:
        description: 'dsh version to install.'
        type: choice
        default: '0.1.2-rc.1'
        options:
          # The published dsh-web image pins 0.1.2-rc.1, so this runs the same
          # dsh as that image.
          - '0.1.2-rc.1'
          # Resolves npm's `latest` tag at install time, so it never goes stale
          # the way a hard-coded version number would.
          - 'latest'
      base_url:
        description: 'Gateway address. Empty -> BASE_URL secret.'
        type: string
        default: ''
      model:
        description: 'Model id(s), comma-separated. Empty -> MODEL secret.'
        type: string
        default: ''
      ngrok_domain:
        description: 'Reserved ngrok domain. Empty -> NGROK_DOMAIN secret.'
        type: string
        default: ''
      workspace:
        description: 'Absolute path to work in. Empty -> the repository checkout.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Sessions collide on the fixed gateway port, so only one runs per repository.
  group: dsh-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dsh:
    runs-on: ubuntu-latest
    # The session's lifetime: it ends when you cancel the run or when this fires.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          # Credentials: secrets only, never inputs.
          api_key: ${{ secrets.API_KEY }}
          password: ${{ secrets.PASSWORD }}
          # Input when filled, else the secret of the same name. `version` has no
          # secret: it is a choice list with a default, so it is always set.
          version: ${{ inputs.version }}
          base_url: ${{ inputs.base_url || secrets.BASE_URL }}
          model: ${{ inputs.model || secrets.MODEL }}
          ngrok_token: ${{ secrets.NGROK_TOKEN }}
          ngrok_domain: ${{ inputs.ngrok_domain || secrets.NGROK_DOMAIN }}
          # Empty means the repository checkout, which is what actions/checkout
          # above already produced — there is no container to mount into.
          workspace_dir: ${{ inputs.workspace }}
