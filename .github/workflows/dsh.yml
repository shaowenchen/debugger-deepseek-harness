# Start a DeepSeek Harness session by hand and get a temporary link.
#   gh workflow run dsh.yml
#   gh workflow run dsh.yml -f model=some-other-model
#
# The Summary of the run carries the link; sign in with your PASSWORD secret.
# The session ends when you cancel the run or the job times out.
name: DeepSeek Harness

on:
  workflow_dispatch:
    inputs:
      # All optional: leave one blank and the secret of the same name is used.
      # None of these is a credential — the API key and password are secrets
      # only, because a workflow input is plain text any reader of the run sees.
      version:
        description: 'dsh version'
        type: choice
        default: '0.1.2-rc.1'
        options:
          # The dsh-web image pins this, so the session runs the same dsh.
          - '0.1.2-rc.1'
          # npm's `latest` tag, resolved at install time so it cannot go stale.
          - 'latest'
      base_url:
        description: 'Gateway address'
        type: string
        default: ''
      model:
        description: 'Model id(s), comma-separated'
        type: string
        default: ''
      ngrok_domain:
        description: 'Reserved ngrok domain'
        type: string
        default: ''
      workspace:
        description: 'Directory to work in'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Sessions collide on the fixed gateway port, so only one runs per repository.
  group: dsh-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dsh:
    runs-on: ubuntu-latest
    # The session's lifetime.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          # Credentials are secrets only; routing takes the input, else the secret.
          api_key: ${{ secrets.API_KEY }}
          password: ${{ secrets.PASSWORD }}
          version: ${{ inputs.version }}
          base_url: ${{ inputs.base_url || secrets.BASE_URL }}
          model: ${{ inputs.model || secrets.MODEL }}
          ngrok_token: ${{ secrets.NGROK_TOKEN }}
          ngrok_domain: ${{ inputs.ngrok_domain || secrets.NGROK_DOMAIN }}
          workspace_dir: ${{ inputs.workspace }}
