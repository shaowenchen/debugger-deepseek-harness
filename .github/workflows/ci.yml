name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -eux
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: ShellCheck
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh

      - name: Node syntax
        run: |
          set -eux
          node --check scripts/gateway.mjs
          node --check scripts/settings.mjs
          node --check tests/gateway.e2e.mjs
          node --check tests/url-discovery.mjs
          node --check tests/session-cookie.mjs

      - name: Public URL discovery
        # No dsh, no tunnel agent, no network: a stub API stands in for the
        # agent. This is the only check that runs the discovery code at all —
        # the end-to-end job sets DSHGW_PUBLIC_URL and so skips it.
        run: node tests/url-discovery.mjs

      - name: Session cookie expiry
        # Also no dsh and no network. Covers the unlimited-session branch the
        # end-to-end job never reaches, and the rule that a malformed duration
        # must fall back to a bounded cookie rather than an endless one.
        run: node tests/session-cookie.mjs

      - name: The dsh home the script writes to is the one dsh reads
        # dsh resolves its home from $DSH_HOME and otherwise falls back to
        # `homedir()/.dsh`. action.sh writes settings.yaml and the workspace
        # registry into that home, so if DSH_HOME is only a shell variable —
        # reaching the helper commands through an inline VAR=... prefix but never
        # reaching dsh itself — every write lands somewhere dsh does not read.
        # The failure is silent: the session starts on the official route with
        # the configured provider simply absent. Require the export.
        run: |
          set -eux
          grep -qE '^export DSH_HOME=' scripts/action.sh
          # And nothing may quietly unset or shadow it later.
          ! grep -qE '^DSH_HOME=' scripts/action.sh
          # The helpers must read the same variable, not a second copy.
          grep -q 'DSH_HOME="\$DSH_HOME"' scripts/action.sh

      - name: The session starts in an empty workspace, not the repository
        # The default workspace must be a directory of the session's own. When it
        # pointed at $PWD the session opened on the repository checkout, which
        # let a session read and modify the action that launched it — and made
        # "what does the session start with" depend on whatever the workflow's
        # earlier steps happened to leave behind.
        run: |
          set -eux
          # A plain name (resolved under the session home), never $PWD or the
          # runner's workspace.
          grep -qE '^: "\$\{DSH_WORKSPACE_DIR:=workspace\}"' scripts/action.sh
          ! grep -qE '^: "\$\{DSH_WORKSPACE_DIR:=\$PWD' scripts/action.sh
          # And the name must resolve under the session home, which is what
          # makes the directory empty rather than a view of the checkout.
          grep -q 'WS_PATH="\$DSH_HOME_DIR/\$DSH_WORKSPACE_DIR"' scripts/action.sh

      - name: dsh's process runs from that workspace too
        # The registry decides which directory the SESSION works in; the process
        # cwd decides everything dsh falls back to — the sandbox policy's
        # workspaceRoot, a session's fallback cwd, the bash/fs tool workdir, and
        # `loadLayeredEnv`, which loads a `.env` from the invoking directory at
        # boot. Without the `cd`, dsh runs from the runner's directory, so all of
        # those stay rooted in the checkout even though the registry points at the
        # empty workspace: the session works in the empty directory while the
        # process still reads the repository's `.env` into its own environment.
        run: |
          set -eux
          grep -qE '^cd "\$WS_PATH"' scripts/action.sh
          # The `cd` must come after the workspace is resolved and its directory
          # created, or it targets an unset/unmade path.
          python3 - <<'PY'
          import re, sys
          text = open('scripts/action.sh').read()
          lines = text.splitlines()
          def find(pattern):
              for i, line in enumerate(lines, 1):
                  if re.search(pattern, line):
                      return i
              return -1
          resolved = find(r'^  \*\)\s+WS_PATH=')
          created = find(r'^mkdir -p "\$WS_PATH"')
          entered = find(r'^cd "\$WS_PATH"')
          started = find(r'^start_dsh$')
          problems = []
          if resolved < 0 or created < 0 or entered < 0 or started < 0:
              problems.append('could not locate resolve/create/cd/start_dsh')
          else:
              if not resolved < entered:
                  problems.append(f'the cd (line {entered}) runs before WS_PATH is resolved (line {resolved})')
              if not created < entered:
                  problems.append(f'the cd (line {entered}) runs before the directory is created (line {created})')
              if not entered < started:
                  problems.append(f'the cd (line {entered}) runs after dsh is started (line {started})')
          for problem in problems:
              print(problem, file=sys.stderr)
          sys.exit(1 if problems else 0)
          PY

      - name: YAML parses
        run: |
          set -eux
          python3 - <<'PY'
          import glob, sys, yaml
          ok = True
          for path in ['*/action.yml', *glob.glob('.github/workflows/*.yml')]:
              for match in sorted(glob.glob(path)):
                  try:
                      yaml.safe_load(open(match))
                      print(f'{match}: ok')
                  except Exception as exc:
                      print(f'{match}: {exc}', file=sys.stderr)
                      ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: action.yml declares what the script reads
        # Each action passes every input to the shared action.sh as an
        # environment variable. A typo here means an input that silently does
        # nothing, which is exactly the kind of bug a run only reveals an hour
        # later.
        run: |
          set -eux
          python3 - <<'PY'
          import glob, re, yaml, sys
          problems = []
          for path in sorted(glob.glob('*/action.yml')):
              action = yaml.safe_load(open(path))
              declared = set(action['inputs'])
              steps = [s for s in action['runs']['steps'] if 'action.sh' in str(s.get('run', ''))]
              if len(steps) != 1:
                  problems.append(f'{path}: expected exactly one step running action.sh, found {len(steps)}')
                  continue
              passed = set()
              for name, value in steps[0]['env'].items():
                  m = re.fullmatch(r'\$\{\{\s*inputs\.([a-z0-9_]+)\s*\}\}', str(value))
                  if m:
                      passed.add(m.group(1))
              # Every declared input must reach the script, or be consumed by the
              # action's own steps (e.g. setup-node) instead.
              missing = declared - passed
              if missing:
                  problems.append(f'{path}: inputs never passed to the script: {sorted(missing)}')
              print(f'{path}: {len(declared)} inputs declared, all forwarded')
          if problems:
              print('\n'.join(problems), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Each action picks a tunnel the script knows
        # The actions are thin wrappers whose only real difference is DSH_TUNNEL,
        # so a name the script's dispatch does not handle would leave that action
        # starting no tunnel at all — a failure that only shows up as a missing
        # link in a real run.
        run: |
          set -eux
          python3 - <<'PY'
          import glob, re, sys, yaml
          script = open('scripts/action.sh').read()
          known = set(re.findall(r'^  ([a-z]+)\)\s+start_\w+_tunnel', script, re.M))
          if not known:
              print('could not find the DSH_TUNNEL dispatch in scripts/action.sh', file=sys.stderr)
              sys.exit(1)
          problems = []
          seen = set()
          for path in sorted(glob.glob('*/action.yml')):
              action = yaml.safe_load(open(path))
              picks = {str((step.get('env') or {})['DSH_TUNNEL'])
                       for step in action['runs']['steps']
                       if 'DSH_TUNNEL' in (step.get('env') or {})}
              if len(picks) != 1:
                  problems.append(f'{path}: expected exactly one DSH_TUNNEL, found {sorted(picks)}')
                  continue
              unknown = picks - known
              if unknown:
                  problems.append(f'{path}: unknown tunnel(s) {sorted(unknown)}, script handles {sorted(known)}')
              seen |= picks
          # Both tunnels must be reachable through some action, or one of them is
          # dead code that CI never exercises.
          unused = known - seen
          if unused:
              problems.append(f'scripts/action.sh handles tunnels no action selects: {sorted(unused)}')
          if problems:
              print('\n'.join(problems), file=sys.stderr)
              sys.exit(1)
          print(f'each action selects one of {sorted(known)}')
          PY

      - name: The version dropdown matches what CI tests
        # The e2e job runs a matrix of dsh versions; this keeps that matrix and
        # the dropdown users pick from in step, so adding an option without
        # testing it (or the reverse) fails here instead of in someone's run.
        run: |
          set -eux
          python3 - <<'PY'
          import sys, yaml
          # PyYAML reads the bare key `on:` as the boolean True (YAML 1.1), so
          # the dispatch inputs live under True, not under the string 'on'.
          def on_block(doc):
              return doc.get('on', doc.get(True))
          # Read from the workflow's own dispatch form, not from an action: the
          # form is what a user picks from, and it currently drives the ngrok
          # action only.
          offer = set(on_block(yaml.safe_load(open('.github/workflows/dsh.yml')))['workflow_dispatch']['inputs']['version']['options'])
          ci = yaml.safe_load(open('.github/workflows/ci.yml'))
          tested = set(ci['jobs']['gateway']['strategy']['matrix']['dsh'])
          if offer != tested:
              print(f'version options {sorted(offer)} != CI e2e matrix {sorted(tested)}', file=sys.stderr)
              sys.exit(1)
          print(f'version dropdown and CI matrix agree: {sorted(offer)}')
          PY

      - name: Workflow contexts are legal for the keys that use them
        # `concurrency` may read only github/inputs/vars — reaching for a secret
        # there fails the whole workflow at parse time, which surfaces as "the
        # workflow stopped running" rather than as an error anyone can read.
        run: |
          set -eux
          python3 - <<'PY'
          import glob, re, sys, yaml
          # Contexts allowed per workflow key, from GitHub's context-availability
          # table. Only the keys this repo actually uses are listed.
          ALLOWED = {
              'concurrency': {'github', 'inputs', 'vars'},
              'env': {'github', 'secrets', 'inputs', 'vars'},
          }
          # A job key checked separately, because it lives one level down:
          # `jobs.<id>.timeout-minutes` may read inputs but, unlike a step key,
          # is not allowed to call functions — so `fromJSON()` there would be
          # rejected only at run time, which is the worst place to find out.
          JOB_KEYS = {'timeout-minutes': {'github', 'needs', 'strategy', 'matrix', 'vars', 'inputs'}}
          bad = []
          for path in glob.glob('.github/workflows/*.yml'):
              doc = yaml.safe_load(open(path))
              for key, allowed in ALLOWED.items():
                  if key not in doc:
                      continue
                  used = set(re.findall(r'\b(github|secrets|inputs|vars|needs|matrix|env)\.', str(doc[key])))
                  illegal = used - allowed
                  if illegal:
                      bad.append(f'{path}: {key} uses {sorted(illegal)}, allowed {sorted(allowed)}')
              for job in (doc.get('jobs') or {}).values():
                  if not isinstance(job, dict):
                      continue
                  for key, allowed in JOB_KEYS.items():
                      if key not in job:
                          continue
                      value = str(job[key])
                      used = set(re.findall(r'\b(github|secrets|inputs|vars|needs|matrix|env)\.', value))
                      illegal = used - allowed
                      if illegal:
                          bad.append(f'{path}: jobs.*.{key} uses {sorted(illegal)}, allowed {sorted(allowed)}')
                      # No functions available here, so an expression calling one
                      # cannot be evaluated by GitHub.
                      called = set(re.findall(r'\b([a-zA-Z]+)\(', value))
                      if called:
                          bad.append(f'{path}: jobs.*.{key} calls {sorted(called)}; no functions are allowed in this key')
          if bad:
              print('\n'.join(bad), file=sys.stderr)
              sys.exit(1)
          print('workflow context usage is legal')
          PY

      - name: Documented secrets match the workflow
        # Both directions, because both have gone wrong: a secret the workflows
        # read but the README never mentions leaves the user guessing, and a
        # name the README still shows after a rename leaves them configuring a
        # secret nothing reads. The second is checked across the whole README,
        # not just its table — the stale names that prompted this were in a
        # copy-paste example.
        run: |
          set -eux
          python3 - <<'PY'
          import glob, re, sys
          used = set()
          for path in glob.glob('.github/workflows/*.yml'):
              used |= set(re.findall(r'secrets\.([A-Z][A-Z0-9_]*)', open(path).read()))
          readme = open('README.md').read()
          documented = set(re.findall(r'^\| `([A-Z][A-Z0-9_]*)` \|', readme, re.M))
          mentioned = set(re.findall(r'secrets\.([A-Z][A-Z0-9_]*)', readme))

          failed = False
          undocumented = used - documented
          if undocumented:
              print(f'secrets read by the workflows but absent from the README table: {sorted(undocumented)}', file=sys.stderr)
              failed = True
          stale = mentioned - used
          if stale:
              print(f'secrets the README names but no workflow reads: {sorted(stale)}', file=sys.stderr)
              failed = True
          if failed:
              sys.exit(1)
          print(f'{len(used)} secrets, documented and all in use: {sorted(used)}')
          PY

  # The gateway is the part with real logic in it (cookie isolation, token
  # re-minting, the WebSocket relay), so it is tested against a real dsh rather
  # than a mock. This job is the reason the action can claim any of that works.
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Every version the workflow offers in its dropdown. Testing only the
        # default would let `latest` rot: the gateway depends on dsh internals
        # (the launch token, the authority-bound cookie, the /api Host fence),
        # and a new dsh could change any of them without this repo being touched.
        dsh: ['0.1.2-rc.1', 'latest']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dsh
        run: |
          set -eux
          npm install --global "@deepseek-ai/dsh@${{ matrix.dsh }}"
          echo "dsh $(dsh --version 2>/dev/null || echo "${{ matrix.dsh }}")"

      - name: settings.mjs writes what dsh accepts
        # A settings.yaml dsh rejects stops the session from ever starting, and
        # a second declaration of the same top-level key is the failure mode a
        # re-run produces — so check both, and that dsh boots with the result.
        #
        # Both routes are covered: the custom one writes a provider block, and
        # the official one writes only the model selection (previously it wrote
        # nothing, so the `model` input was silently ignored there).
        run: |
          set -eux
          rm -rf /tmp/settings-home && mkdir -p /tmp/settings-home
          DSH_HOME=/tmp/settings-home \
          DSH_BASE_URL=https://gateway.example/v1 \
          DSH_MODEL='model-a,model-b' DSH_API_KEY=sk-test \
            node scripts/settings.mjs
          # Twice, to prove the managed block is replaced rather than appended.
          DSH_HOME=/tmp/settings-home \
          DSH_BASE_URL=https://gateway.example/v1 \
          DSH_MODEL='model-a,model-b' DSH_API_KEY=sk-test \
            node scripts/settings.mjs
          test "$(grep -c '^llm-pi-ai:' /tmp/settings-home/settings.yaml)" = 1
          test "$(grep -c '^agent-default-model:' /tmp/settings-home/settings.yaml)" = 1

          # The sentinel means "no explicit choice": with the official route it
          # must write nothing at all, leaving dsh its own default model.
          rm -rf /tmp/settings-official && mkdir -p /tmp/settings-official
          DSH_HOME=/tmp/settings-official DSH_BASE_URL='' DSH_MODEL='default' \
            node scripts/settings.mjs
          test ! -e /tmp/settings-official/settings.yaml

          # An explicit model on the official route writes only the selection —
          # no provider block, since llm-deepseek already owns that route.
          rm -rf /tmp/settings-official2 && mkdir -p /tmp/settings-official2
          DSH_HOME=/tmp/settings-official2 DSH_BASE_URL='' DSH_MODEL='deepseek-v4-pro' \
            node scripts/settings.mjs
          test "$(grep -c '^agent-default-model:' /tmp/settings-official2/settings.yaml)" = 1
          test "$(grep -c '^llm-pi-ai:' /tmp/settings-official2/settings.yaml)" = 0
          grep -q "model: 'deepseek-v4-pro'" /tmp/settings-official2/settings.yaml

          # On a custom route `default` is an ordinary model id, not a sentinel:
          # the gateway belongs to the caller, and refusing the value would fail
          # a session whose gateway really does serve a model of that name.
          # It must register and become the default selection.
          rm -rf /tmp/settings-custom-default && mkdir -p /tmp/settings-custom-default
          DSH_HOME=/tmp/settings-custom-default \
          DSH_BASE_URL=https://gateway.example/v1 DSH_MODEL='default' \
            node scripts/settings.mjs
          grep -q "id: 'default'" /tmp/settings-custom-default/settings.yaml
          grep -q "model: 'default'" /tmp/settings-custom-default/settings.yaml

          # An empty model id on a custom route has no valid declaration to
          # write — a provider block must list at least one model.
          if DSH_HOME=/tmp/settings-custom-default DSH_BASE_URL=https://gateway.example/v1 \
               DSH_MODEL='' node scripts/settings.mjs 2>/dev/null; then
            echo 'a custom route with an empty model id should have been refused' >&2
            exit 1
          fi

          # A model entry may carry optional metadata in dsh's own field names
          # (`maxTokens`, not `maxOutput`), and an entry with no metadata must
          # still inherit the route defaults rather than freezing them.
          rm -rf /tmp/settings-meta && mkdir -p /tmp/settings-meta
          DSH_HOME=/tmp/settings-meta DSH_BASE_URL=https://gateway.example/v1 \
          DSH_MODEL='rich-model|Rich Model|128000|4096,bare-model' \
            node scripts/settings.mjs
          grep -q "name: 'Rich Model'" /tmp/settings-meta/settings.yaml
          grep -q 'contextWindow: 128000' /tmp/settings-meta/settings.yaml
          grep -q 'maxTokens: 4096' /tmp/settings-meta/settings.yaml
          test "$(grep -c 'contextWindow:' /tmp/settings-meta/settings.yaml)" = 1
          test "$(grep -c 'id: ' /tmp/settings-meta/settings.yaml)" = 2

          # A capacity that dsh would refuse must fail here, naming the field,
          # rather than as a rejected session later.
          if DSH_HOME=/tmp/settings-meta DSH_BASE_URL=https://gateway.example/v1 \
               DSH_MODEL='m|N|not-a-number|4096' node scripts/settings.mjs 2>/dev/null; then
            echo 'a non-numeric contextWindow should have been refused' >&2
            exit 1
          fi

          # Switching routes must not leave the other route's declaration
          # behind: two `llm-pi-ai` keys would make dsh reject the document.
          DSH_HOME=/tmp/settings-home DSH_BASE_URL='' DSH_MODEL='deepseek-v4-pro' \
            node scripts/settings.mjs
          test "$(grep -c '^llm-pi-ai:' /tmp/settings-home/settings.yaml)" = 0

          DSH_HOME=/tmp/settings-home DEEPSEEK_API_KEY=sk-test \
            timeout 90 dsh --profile web --no-open --port 3098 > /tmp/settings-home/boot.log 2>&1 &
          for _ in $(seq 1 45); do
            grep -q 'dsh web:' /tmp/settings-home/boot.log && break
            sleep 2
          done
          grep 'dsh web:' /tmp/settings-home/boot.log

      - name: Start dsh web
        run: |
          set -eux
          mkdir -p /tmp/dsh
          DSH_HOME=/tmp/dsh dsh --profile web --no-open --port 3099 > /tmp/dsh/boot.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q 'dsh web:' /tmp/dsh/boot.log && break
            sleep 2
          done
          grep 'dsh web:' /tmp/dsh/boot.log

      - name: Start the gateway
        run: |
          set -eux
          DSHGW_INNER_AUTHORITY=127.0.0.1:3099 \
          DSHGW_PASSWORD=testpass \
          DSHGW_PUBLIC_URL=https://example.invalid \
            node scripts/gateway.mjs < /tmp/dsh/boot.log > /tmp/dsh/gateway.log 2>&1 &
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3080/__dshgw/health)" = 200 ] && break
            sleep 1
          done
          cat /tmp/dsh/gateway.log

      - name: Gateway end-to-end
        env:
          DSH_LOG: /tmp/dsh/boot.log
        run: node tests/gateway.e2e.mjs

      - name: Gateway log on failure
        if: failure()
        run: cat /tmp/dsh/gateway.log || true
