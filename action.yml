name: 'Run DeepSeek Harness'
description: >-
  Start an ephemeral DeepSeek Harness (dsh) web session and expose it through an
  ngrok tunnel behind a password.
author: 'shaowenchen'

branding:
  icon: 'terminal'
  color: 'blue'

inputs:
  api_key:
    description: 'Model API key.'
    required: true
    default: ''
  version:
    description: 'dsh version to install.'
    required: false
    default: '0.1.2-rc.1'
  password:
    description: 'Password for the session link.'
    required: false
    default: ''
  ngrok_token:
    description: 'ngrok authtoken.'
    required: false
    default: ''
  base_url:
    description: 'Model API endpoint, e.g. https://gateway.example/v1.'
    required: false
    default: ''
  model:
    description: >-
      Model id(s), comma-separated; the first is the default. An id may carry
      optional metadata as id|name|contextWindow|maxTokens. 'default' uses the
      endpoint's own default model.
    required: false
    default: 'default'
  workspace_dir:
    description: >-
      The directory the session works in, and the one dsh runs from; defaults
      to an empty workspace/.
    required: false
    default: ''
  extra_args:
    description: "Extra dsh flags, e.g. '--patch /x.yml'."
    required: false
    default: ''
  log_level:
    description: "Log level; 'debug' is verbose."
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # dsh needs a current Node (its bundles use APIs the runner's default Node
    # lacks — the image it replaced shipped Node 24 for the same reason).
    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Validate inputs
      shell: bash
      env:
        DSH_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        [ -n "$DSH_VERSION" ] || { echo "::error::version is required"; exit 1; }
        # base_url and model are independent: model has a default, so requiring
        # one to accompany the other would make the common case fail.

    - name: Install ngrok
      if: inputs.ngrok_token != ''
      shell: bash
      run: |
        set -euo pipefail
        # Same distribution channel debugger-action uses; a single static binary.
        url="https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz"
        curl -fsSL "$url" | sudo tar -xz -C /usr/local/bin
        sudo chmod +x /usr/local/bin/ngrok
        ngrok --version

    - name: Start the session
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        DSH_VERSION: ${{ inputs.version }}
        DSH_API_KEY: ${{ inputs.api_key }}
        DSH_PASSWORD: ${{ inputs.password }}
        DSH_BASE_URL: ${{ inputs.base_url }}
        DSH_MODEL: ${{ inputs.model }}
        DSH_WORKSPACE_DIR: ${{ inputs.workspace_dir }}
        DSH_LOG_LEVEL: ${{ inputs.log_level }}
        DSH_EXTRA_ARGS: ${{ inputs.extra_args }}
        NGROK_TOKEN: ${{ inputs.ngrok_token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/action.sh"
