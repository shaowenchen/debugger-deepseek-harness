name: 'Run DeepSeek Harness (Cloudflare Tunnel)'
description: >-
  Start an ephemeral DeepSeek Harness (dsh) web session and expose it through a
  Cloudflare Tunnel behind a password.
author: 'shaowenchen'

branding:
  icon: 'cloud'
  color: 'orange'

inputs:
  api_key:
    description: 'Model API key.'
    required: true
    default: ''
  version:
    description: 'dsh version to install.'
    required: false
    default: '0.1.2-rc.1'
  password:
    description: 'Password for signing in to the session.'
    required: true
    default: ''
  cloudflare_token:
    description: >-
      Token of a Cloudflare tunnel. Empty starts a quick tunnel instead: a
      random trycloudflare.com hostname with no account behind it.
    required: false
    default: ''
  base_url:
    description: 'Model API endpoint, e.g. https://gateway.example/v1.'
    required: false
    default: ''
  model:
    description: >-
      Model id(s), comma-separated; the first is the default. An id may carry
      optional metadata as id|name|contextWindow|maxTokens. 'default' uses the
      endpoint's own default model.
    required: false
    default: 'default'
  workspace_dir:
    description: >-
      The directory the session works in, and the one dsh runs from; defaults
      to an empty workspace/.
    required: false
    default: ''
  extra_args:
    description: "Extra dsh flags, e.g. '--patch /x.yml'."
    required: false
    default: ''
  log_level:
    description: "Log level; 'debug' is verbose."
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # dsh needs a current Node (its bundles use APIs the runner's default Node
    # lacks — the image it replaced shipped Node 24 for the same reason).
    - uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Validate inputs
      shell: bash
      env:
        DSH_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        [ -n "$DSH_VERSION" ] || { echo "::error::version is required"; exit 1; }

    - name: Install cloudflared
      shell: bash
      run: |
        set -euo pipefail
        # The release's canonical "latest" asset, so the version cannot go
        # stale the way a pinned one would — the same reason the dsh version
        # dropdown offers `latest`. A single static binary, no package manager.
        url="https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
        sudo curl -fsSL -o /usr/local/bin/cloudflared "$url"
        sudo chmod +x /usr/local/bin/cloudflared
        cloudflared --version

    - name: Start the session
      shell: bash
      env:
        # Which tunnel the shared script should open. Not an input: this action
        # is the Cloudflare one, so the choice is fixed here rather than offered
        # to the caller (the ngrok/ action sets it to 'ngrok').
        DSH_TUNNEL: 'cloudflare'
        DSH_VERSION: ${{ inputs.version }}
        DSH_API_KEY: ${{ inputs.api_key }}
        DSH_PASSWORD: ${{ inputs.password }}
        DSH_BASE_URL: ${{ inputs.base_url }}
        DSH_MODEL: ${{ inputs.model }}
        DSH_WORKSPACE_DIR: ${{ inputs.workspace_dir }}
        DSH_LOG_LEVEL: ${{ inputs.log_level }}
        DSH_EXTRA_ARGS: ${{ inputs.extra_args }}
        CLOUDFLARE_TOKEN: ${{ inputs.cloudflare_token }}
      run: bash "${{ github.action_path }}/../scripts/action.sh"
